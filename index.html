<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>食品価格ウォッチ | 食品の価格・セール情報</title>
<meta name="description" content="米・牛乳・卵・肉・野菜など食品の価格情報をYahoo!ショッピングの実データでお届けします。">
<link rel="stylesheet" href="/styles.css">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WQXKJFL4K4"></script>
<script src="/app.js" defer></script>
</head>
<body>
<header class="site-header">
  <h1>食品価格ウォッチ</h1>
  <p class="tagline">食品の価格情報を、実データで毎日チェック</p>
  <p class="meta" id="data-meta">価格データを読み込み中…</p>
</header>

<main>
  <section class="controls">
    <input type="search" id="search" placeholder="商品名・店名で検索" aria-label="検索">
    <select id="sort" aria-label="並び替え">
      <option value="default">おすすめ順</option>
      <option value="price-asc">価格が安い順</option>
      <option value="price-desc">価格が高い順</option>
      <option value="name">名前順</option>
    </select>
  </section>
  <nav class="tabs" id="tabs" aria-label="カテゴリ"></nav>
  <section class="grid" id="grid"></section>
  <p class="empty" id="empty" hidden>条件に合う商品がありません。</p>

  <section class="watch">
    <h2>買い物メモ <span id="watch-count"></span></h2>
    <ul id="watch-list"></ul>
    <p class="watch-total" id="watch-total"></p>
  </section>
</main>

<footer>
  <p>価格はYahoo!ショッピング出店ストアの販売価格です。送料は商品ごとに異なります。最新の価格は商品ページでご確認ください。</p>
  <p>出典：Yahoo!ショッピング 商品検索API</p>
  <p>このサイトは個人情報を収集しません。</p>
</footer>
</body>
</html>
